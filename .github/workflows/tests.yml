name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          coverage: none

      - name: Syntax check (php -l)
        # Compile-time deprecations are printed to stdout so that they reach lint.txt, and fail the job
        # (the bundled third-party libraries in site/librairies included).
        run: |
          set -o pipefail
          find . -name '*.php' -type f -print0 \
            | xargs -0 -n1 -P4 php -d error_reporting=-1 -d display_errors=stdout -d log_errors=0 -l \
            | { grep -v '^No syntax errors detected' || true; } | tee lint.txt
          if grep -qE 'Parse error|Fatal error' lint.txt; then
            exit 1
          fi
          if grep -E 'Deprecated' lint.txt; then
            echo "::error::PHP deprecations (listed above)"
            exit 1
          fi

      - name: Regression scripts
        run: |
          php tests/filemanager-frontend-guard.php
          php _tools/tests/fileeditor.php
          php _tools/tests/notificationmail-conditions.php
          php _tools/tests/notificationmail-template-loading.php
          php _tools/tests/notificationmail-template-loading-j6.php
          php _tools/tests/file-index-custom-properties.php
          php _tools/tests/category-association-propagation.php
          python3 _tools/tests/remote-size/run.py --php php
