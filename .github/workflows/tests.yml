name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none

      - name: Syntax check (php -l)
        # site/librairies/json only loads when json_encode() is missing (PHP < 5.2)
        run: |
          set -o pipefail
          find . -path ./site/librairies/json -prune -o -name '*.php' -type f -print0 \
            | xargs -0 -n1 -P4 php -d error_reporting=-1 -l \
            | { grep -v '^No syntax errors detected' || true; } | tee lint.txt
          ! grep -qE 'Parse error|Fatal error' lint.txt

      - name: Regression scripts
        run: |
          php tests/filemanager-frontend-guard.php
          php _tools/tests/fileeditor.php
          php _tools/tests/notificationmail-conditions.php
          python3 _tools/tests/remote-size/run.py --php php
