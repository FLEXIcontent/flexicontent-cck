FLEXI_FIELD_VOTE_SHOW_RATING_LABEL="Show rating label"
FLEXI_FIELD_VOTE_SHOW_RATING_LABEL_DESC="Show the rating label (e.g. 'Average rating') above the stars, in the item view and in the lists. The label text can be changed in the next option"
FLEXI_FIELD_VOTE_RATING_RESOLUTION="Rating Resolution<br/><small>for new sites OR *</small>"
FLEXI_FIELD_VOTE_RATING_RESOLUTION_DESC="This is to be used while building new sites or ... read below. <br/>Joomla's built-in Resolution is 5 <br/><br/><b>NOTE:</b> Changing this in existing sites will make rating average to appear wrongly !! <br/><br/><b>NOTE:</b> (for developers) It is possible to update rating table with an SQL query like: <br/><i>UPDATE nnn_content_rating SET rating_sum = rating_sum * (_new_resolution_ / _old_resolution_)</i> <br/>and same for TABLE nnn_flexicontent_items_extravote, <br/>BACKUP these 2 tables before doing the SQL query  <br/><br/><b>NOTE:</b> This will cause non-FLEXIcontent extensions to display vote ratings WRONGLY, so do not change this if you use non-FLEXIcontent extensions to display ratings"
FLEXI_FIELD_VOTE_RATING_STARS="Rating Stars <br/><small>resolution &gt;= stars</small>"
FLEXI_FIELD_VOTE_RATING_STARS_DESC="The number of displayed stars, Joomla's built-in is also 5. <br/><br/><b>NOTE:</b> Must be: resolution &gt;= stars <br/><br/><b>EXAMPLES:</b><br/>-- 10 stars with half star voting, set Resolution: 20, Stars 10 <br/>-- 5 stars with quarter star voting, set Resolution: 20, Stars: 5 <br/>-- 10 stars with one star voting, set Resolution: 10, Stars: 10"
FLEXI_FIELD_VOTE_PERMISSIONS="Permission"
FLEXI_FIELD_VOTE_PERMISSIONS_DESC="You can configure who is allowed to submit votes, message for non-authorized users, etc"
FLEXI_FIELD_VOTE_SUBMIT_ACCESS="Submit Access"
FLEXI_FIELD_VOTE_SUBMIT_ACCESS_DESC="User Group assigned this access level will be able to vote. <br/><br/>- e.g <b>create an access level 'Content Voting'</b> and assign it to the Usergroups that you need <br/><br/><b>NOTE:</b> You only need to assign it to the parent UserGroup e.g. if you assign this Access Level to usergroup 'Registered' then ALL usergroups being children of it will have it ..."
