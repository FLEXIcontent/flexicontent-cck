FLEXI_FIELD_VOTE_STARS_TOOLTIPS_DESC="Display the rating text (e.g. &quot;Good 4/5&quot;) above a star while the mouse is over it, the tooltip is hidden when the vote is made"
FLEXI_FIELD_VOTE_STARS_COLOR="Stars color"
