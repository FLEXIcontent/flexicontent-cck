FLEXI_FIELD_VOTE_REVIEWS_LOADER_DESC="Display a loader (spinner) while the next reviews are loaded by scrolling in the modal window, and the end of the list (&quot;That's all&quot;) after the last review"
FLEXI_FIELD_VOTE_REVIEWS_STORE_RATING="Save ratings without a review"
FLEXI_FIELD_VOTE_REVIEWS_STORE_RATING_DESC="<b>No</b>: voting with the stars does not create a review record, votes are protected from double voting by the session / IP address (as the voting field without reviews). The rating of a review is still a vote of the item.<br><b>Yes</b>: a logged user voting with the stars gets a review record without text (it is not displayed in the site), this allows a single vote per user account, that can be changed from any browser. These records are listed in the reviews manager as &quot;rating only&quot;."
FLEXI_FIELD_VOTE_REVIEWS_USEFUL="Useful votes of reviews"
FLEXI_FIELD_VOTE_REVIEWS_USEFUL_DESC="Display under each review the number of people that found it useful, and the 'Was this helpful?' question with Yes / No buttons. The users can not vote for their own review"
FLEXI_FIELD_VOTE_REVIEWS_USEFUL_LOGGED="Logged users"
FLEXI_FIELD_VOTE_REVIEWS_USEFUL_ANYONE="Anyone (guests by IP)"
FLEXI_FIELD_VOTE_REVIEWS_INLINE_INFO="<b>Inline mode:</b> the stars and the reviews button are displayed where this field is placed, but the reviews list is displayed by the item template, add this code where the list should appear (e.g. at the end of the item.php of the template): <br/><code>&lt;?php echo $item-&gt;fields['voting']->display_reviews; ?&gt;</code><br/>The default FLEXIcontent templates already include it, the field must be in a field position or in the renderonly position of the template."
FLEXI_FIELD_VOTE_NO_ACCESS_MSG="Message"
FLEXI_FIELD_VOTE_NO_ACCESS_MSG_DESC="The Tooltip message (language string) that will be displayed to users that cannot vote, e.g. you can ask your users to register or buy subscription, etc <br/><br/><b>NOTE:</b> Leave blank to display a default message that states the name of the required Access Level"
