; FLEXIcontent
; Language strings needed by Joomla mail templates (com_mails).
; The extension name of the FLEXIcontent component is "FLEXIcontent", so Joomla
; loads this file when rendering or listing its mail templates.

COM_FLEXICONTENT="FLEXIcontent"

; Titles and descriptions shown in com_mails
COM_FLEXICONTENT_MAIL_NOTIFICATION_NEW_TITLE="New content submitted"
COM_FLEXICONTENT_MAIL_NOTIFICATION_NEW_DESC="Notification sent when new content is submitted and published immediately."
COM_FLEXICONTENT_MAIL_NOTIFICATION_NEW_PENDING_TITLE="New content pending publication"
COM_FLEXICONTENT_MAIL_NOTIFICATION_NEW_PENDING_DESC="Notification sent when new content is submitted and needs publication approval."
COM_FLEXICONTENT_MAIL_NOTIFICATION_EXISTING_TITLE="Content updated"
COM_FLEXICONTENT_MAIL_NOTIFICATION_EXISTING_DESC="Notification sent when existing content is updated and no version review is needed."
COM_FLEXICONTENT_MAIL_NOTIFICATION_EXISTING_REVIEWAL_TITLE="Content updated - version review needed"
COM_FLEXICONTENT_MAIL_NOTIFICATION_EXISTING_REVIEWAL_DESC="Notification sent when existing content is updated and the new version needs review."
COM_FLEXICONTENT_MAIL_NOTIFICATION_APPROVAL_REQUEST_TITLE="Publication approval request"
COM_FLEXICONTENT_MAIL_NOTIFICATION_APPROVAL_REQUEST_DESC="Notification sent when a user requests publication approval for a content item."

; Default subjects and bodies of the notification templates
FLEXI_NF_MAIL_SUBJECT_NEW="[{SITENAME}] New content submitted: {TITLE}"
FLEXI_NF_MAIL_BODY_NEW="New content submitted\n\nTitle: {TITLE}\nState: {STATE}\nAuthor: {CREATOR}\nEditor: {EDITOR_NAME} ({EDITOR_USERNAME})\nCreated: {CREATED}\n\nCategories: {CATEGORIES}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nCustom fields:\n{FIELDS}\n\nView: {VIEW_URL}\nFrontend edit: {EDIT_URL_FE}\nBackend edit: {EDIT_URL_BE}"

FLEXI_NF_MAIL_SUBJECT_NEW_PENDING="[{SITENAME}] New content pending publication: {TITLE}"
FLEXI_NF_MAIL_BODY_NEW_PENDING="New content pending publication\n\nTitle: {TITLE}\nState: {STATE}\nAuthor: {CREATOR}\nEditor: {EDITOR_NAME} ({EDITOR_USERNAME})\nCreated: {CREATED}\n\nCategories: {CATEGORIES}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nCustom fields:\n{FIELDS}\n\nView: {VIEW_URL}\nFrontend edit: {EDIT_URL_FE}\nBackend edit: {EDIT_URL_BE}"

FLEXI_NF_MAIL_SUBJECT_EXISTING="[{SITENAME}] Content updated: {TITLE}"
FLEXI_NF_MAIL_BODY_EXISTING="Updated content\n\nTitle: {TITLE}\nState: {STATE}\nAuthor: {CREATOR}\nLast editor: {MODIFIER}\nEditor: {EDITOR_NAME} ({EDITOR_USERNAME})\nCreated: {CREATED}\nModified: {MODIFIED}\n\nCategories: {CATEGORIES}\nAdded to categories: {CATEGORIES_ADDED}\nRemoved from categories: {CATEGORIES_REMOVED}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nCustom fields:\n{FIELDS}\n\nView: {VIEW_URL}\nFrontend edit: {EDIT_URL_FE}\nBackend edit: {EDIT_URL_BE}"

FLEXI_NF_MAIL_SUBJECT_EXISTING_REVIEWAL="[{SITENAME}] Content updated - version review needed: {TITLE}"
FLEXI_NF_MAIL_BODY_EXISTING_REVIEWAL="Updated content needing version review\n\nTitle: {TITLE}\nState: {STATE}\nAuthor: {CREATOR}\nLast editor: {MODIFIER}\nEditor: {EDITOR_NAME} ({EDITOR_USERNAME})\nCreated: {CREATED}\nModified: {MODIFIED}\n\nCategories: {CATEGORIES}\nAdded to categories: {CATEGORIES_ADDED}\nRemoved from categories: {CATEGORIES_REMOVED}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nCustom fields:\n{FIELDS}\n\nView: {VIEW_URL}\nFrontend edit: {EDIT_URL_FE}\nBackend edit: {EDIT_URL_BE}"

FLEXI_NF_MAIL_SUBJECT_APPROVAL_REQUEST="[{SITENAME}] Approval request: {TITLE}"
FLEXI_NF_MAIL_BODY_APPROVAL_REQUEST="Approval request\n\nThe user {EDITOR_NAME} ({EDITOR_USERNAME}) requests publication approval for the following content item.\n\nTitle: {TITLE}\nState: {STATE}\nAuthor: {CREATOR}\nCreated: {CREATED}\n\nCategories: {CATEGORIES}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nCustom fields:\n{FIELDS}\n\nView: {VIEW_URL}\nFrontend edit: {EDIT_URL_FE}\nBackend edit: {EDIT_URL_BE}"
