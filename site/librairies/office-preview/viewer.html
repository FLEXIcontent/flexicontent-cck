<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document preview</title>
<style>
:root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #24344b; background: #f4f6f8; }
body { margin: 0; }
#message, nav { padding: .75rem 1rem; margin: 0; }
#message:empty, nav:empty { display: none; }
nav { position: sticky; top: 0; background: white; border-bottom: 1px solid #dce2e9; }
select { max-width: 100%; font: inherit; }
table { border-collapse: collapse; margin: 1rem; background: white; }
th, td { border: 1px solid #dce2e9; padding: .25rem .6rem; text-align: start; white-space: pre-wrap; }
th { color: #43526a; background: #f3f5f8; }
canvas.slide:not([hidden]) { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100dvh - 4rem); margin: .75rem auto; object-fit: contain; background: white; }
.docx-wrapper { padding: .75rem !important; background: transparent !important; }
</style>
<script defer src="viewer.js"></script></head>
<body><p id="message" role="status"></p><nav></nav><main></main></body></html>
